<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plan B Studio Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: the Plan B hallway at night. The logo door sits lit in the hero; each game is an app icon on a door-panel card down the hall. Single dark look, by brand choice. */
:root{
  --hallway:#14181F; --floor:#0B0E13; --door:#2E5E5A; --door-deep:#244B48;
  --brass:#D4A64A; --lamp:#F2B66B; --plaster:#E9E4DA; --dim:#A9A69D; --edge:#2A313C;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--hallway);color:var(--plaster);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}

/* Hero */
.hero{position:relative;overflow:hidden;background:var(--hallway)}
.hero .inner{display:flex;align-items:center;gap:48px;flex-wrap:wrap;padding-block:56px 72px;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36px;background:var(--floor)}
.glow{position:absolute;bottom:0;left:50%;width:min(640px,90%);height:36px;transform:translateX(-50%);background:var(--lamp);opacity:.14;z-index:1}
.doorwrap{flex:none;position:relative;z-index:2}
.doorwrap svg{width:180px;height:auto;display:block}
.knob{transform-origin:192px 200px}
.doorwrap:hover .knob{animation:knock .5s ease 2}
@keyframes knock{50%{transform:scale(1.25)}}
.brand{flex:1 1 340px;min-width:0;z-index:2;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(56px,10vw,112px);line-height:.92;letter-spacing:-.02em}
h1 small{display:block;font-weight:500;font-size:clamp(18px,2.4vw,26px);letter-spacing:.5em;text-transform:uppercase;color:var(--brass);margin-top:10px}
.tag{font-family:var(--display);font-weight:500;font-size:24px;color:var(--lamp)}
.brand p{margin:0;max-width:52ch;color:var(--dim);font-size:17px}

/* Directory */
main{padding-block:40px 64px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:28px}
.bar h2{margin:0;font-family:var(--display);font-weight:800;font-size:28px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 14px var(--body);border:1px solid var(--edge);background:transparent;color:var(--plaster);padding:7px 14px;border-radius:999px;cursor:pointer;min-height:36px}
.chip:hover{border-color:var(--brass)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--hallway)}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--door);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;
  box-shadow:inset 0 0 0 3px var(--door-deep);transition:transform .2s ease}
.card:hover{transform:translateY(-3px)}
.card::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;background:var(--lamp);opacity:0;transition:opacity .2s}
.card:hover::after{opacity:.9}
.top{display:flex;gap:16px;align-items:center}
.icon{width:84px;height:84px;flex:none;border-radius:20px;overflow:hidden;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.icon svg{width:72%;height:auto}
.icon img{width:100%;height:100%;object-fit:cover}
.titles{min-width:0}
.unit{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);font-weight:700}
.card h3{margin:2px 0 0;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;text-wrap:balance}
.aka{font-size:13px;color:#C7D3CF;margin-top:4px}
.card p{margin:0;color:#DCE4E0;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.t{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--door-deep);color:#C7D3CF}
.btn{display:flex;justify-content:center;align-items:center;font:700 15px var(--body);padding:12px 14px;border-radius:4px;text-decoration:none;min-height:44px}
.btn.live{background:var(--brass);color:var(--hallway)}
.btn.live:hover{background:var(--lamp)}
.btn.soon{border:1px dashed rgba(233,228,218,.35);color:#C7D3CF}
footer{border-top:1px solid var(--edge);padding-block:24px 32px;color:var(--dim);font-size:14px}
footer .inner{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center}
.mini{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;color:var(--plaster);font-size:18px}
.mini span{font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
@media (prefers-reduced-motion:reduce){.card,.card::after{transition:none}.card:hover{transform:none}.doorwrap:hover .knob{animation:none}}
</style>

<section class="hero gutter">
  <div class="glow" aria-hidden="true"></div>
  <div class="inner">
    <div class="doorwrap">
      <svg viewBox="0 0 240 340" role="img" aria-label="Plan B Studio logo: a teal door with a brass letter B and lamplight under it">
        <rect x="20" y="20" width="200" height="316" rx="6" fill="#0B0E13" stroke="#2A313C" stroke-width="2"/>
        <rect x="32" y="32" width="176" height="304" rx="2" fill="#2E5E5A"/>
        <rect x="56" y="214" width="128" height="94" rx="2" fill="none" stroke="#244B48" stroke-width="3"/>
        <rect x="76" y="56" width="88" height="108" rx="8" fill="#D4A64A"/>
        <rect x="82" y="62" width="76" height="96" rx="5" fill="none" stroke="#14181F" stroke-width="2" opacity=".35"/>
        <text x="120" y="140" text-anchor="middle" font-size="86" font-weight="800" font-family="Bricolage Grotesque, Arial Black, sans-serif" fill="#14181F">B</text>
        <circle cx="120" cy="190" r="7" fill="#D4A64A"/><circle cx="120" cy="190" r="3" fill="#14181F"/>
        <circle class="knob" cx="192" cy="200" r="8" fill="#D4A64A"/>
        <rect x="32" y="332" width="176" height="4" fill="#F2B66B"/>
      </svg>
    </div>
    <div class="brand">
      <div class="eyebrow">Game studio · Apartment B</div>
      <h1>Plan B<small>Studio</small></h1>
      <div class="tag">Knock twice.</div>
      <p>Every Plan B game, behind one door. Free to play on Android, made in Godot.</p>
    </div>
  </div>
</section>

<main class="gutter">
  <div class="inner">
    <div class="bar">
      <h2 id="count">The games</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter by genre"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<footer class="gutter">
  <div class="inner">
    <div class="mini">
      <svg viewBox="0 0 240 340" width="22" height="31" aria-hidden="true"><rect x="20" y="20" width="200" height="316" rx="6" fill="#0B0E13"/><rect x="32" y="32" width="176" height="304" rx="2" fill="#2E5E5A"/><rect x="76" y="56" width="88" height="108" rx="8" fill="#D4A64A"/><rect x="32" y="332" width="176" height="4" fill="#F2B66B"/></svg>
      Plan B <span>Studio</span>
    </div>
    <div>© 2026 Plan B Studio · It was supposed to be the backup plan.</div>
  </div>
</footer>

<script>
/* To use a real app icon, set `icon` to its image (a data: URI or a published file path).
   To activate a store button, set `url` to the game's Google Play link. */
const GAMES = [
  {id:"bombboi", name:"BombBoi", genre:"Platformer", bg:"#B9502F", url:"", icon:"",
   blurb:"Run, jump and dodge through levels that start easy and get tougher every stage.", tags:["Tap controls","Levels"],
   art:'<circle cx="50" cy="56" r="28" fill="#14181F"/><rect x="45" y="20" width="10" height="12" rx="2" fill="#14181F"/><path d="M50 20 q6 -10 14 -6" stroke="#F2B66B" stroke-width="4" fill="none"/><circle cx="66" cy="13" r="5" fill="#FFD84D"/><circle cx="41" cy="52" r="4" fill="#fff"/><circle cx="59" cy="52" r="4" fill="#fff"/>'},
  {id:"ballfusion", name:"Ball Fusion", aka:"formerly Ball Fall", genre:"Puzzle", bg:"#1D3E5C", url:"", icon:"",
   blurb:"Drop balls into the jar. Matching balls fuse into bigger ones. Don't let it overflow.", tags:["Physics","Merge"],
   art:'<path d="M18 30 v52 q0 8 8 8 h48 q8 0 8 -8 v-52" stroke="#E9E4DA" stroke-width="4" fill="none"/><circle cx="34" cy="76" r="10" fill="#F2B66B"/><circle cx="58" cy="72" r="15" fill="#E07A57"/><circle cx="44" cy="54" r="8" fill="#8FD3C9"/><circle cx="50" cy="16" r="7" fill="#E9E4DA"/>'},
  {id:"freethrowaway", name:"Free Throwaway", genre:"Arcade", bg:"#56693A", url:"", icon:"",
   blurb:"Flick crumpled paper into the trash can. Every level puts a new obstacle in the way.", tags:["Flick to throw","Levels"],
   art:'<path d="M58 50 h28 l-4 40 h-20 z" fill="#C9CFC4"/><rect x="56" y="46" width="32" height="6" rx="2" fill="#E9E4DA"/><circle cx="24" cy="70" r="11" fill="#fff"/><path d="M28 58 q14 -40 44 -16" stroke="#fff" stroke-width="3" stroke-dasharray="4 5" fill="none"/>'},
  {id:"rotatetofit", name:"Rotate to Fit", aka:"working title · Flip n' Fit?", genre:"Puzzle", bg:"#3D4F8F", url:"", icon:"",
   blurb:"A wall is coming. Rotate and flip your block cluster to match the cutout in time. 120 levels.", tags:["120 levels","Spatial"],
   art:'<rect x="10" y="14" width="80" height="72" rx="3" fill="#2A3768"/><path d="M38 36 h12 v12 h12 v12 h-24 z" fill="#E9E4DA"/><g transform="rotate(-20 30 64)"><path d="M18 56 h12 v12 h12 v12 h-24 z" fill="#F2B66B"/></g>'},
  {id:"tiltdeath", name:"Tilt Death", genre:"Action", bg:"#2B2730", url:"", icon:"",
   blurb:"Tilt your phone to steer, shoot your way out, and escape the horde in this top-down zombie run.", tags:["Tilt controls","Shooter"],
   art:'<circle cx="50" cy="50" r="10" fill="#F2B66B"/><rect x="56" y="47" width="14" height="5" fill="#F2B66B"/><circle cx="18" cy="24" r="8" fill="#7FA35B"/><circle cx="84" cy="30" r="8" fill="#7FA35B"/><circle cx="24" cy="80" r="8" fill="#7FA35B"/><circle cx="78" cy="78" r="8" fill="#7FA35B"/><path d="M74 49 h12" stroke="#FFD84D" stroke-width="3"/>'},
  {id:"pizzadash", name:"Pizza Dash", genre:"Runner", bg:"#C47A1A", url:"", icon:"",
   blurb:"Sprint through the city with a wobbling stack of pizza boxes. Lean, balance, deliver.", tags:["3D runner","Balance"],
   art:'<g transform="rotate(-6 50 50)"><rect x="28" y="62" width="44" height="10" rx="1" fill="#fff"/><rect x="31" y="50" width="44" height="10" rx="1" fill="#F7EBD8"/><rect x="25" y="38" width="44" height="10" rx="1" fill="#fff"/><rect x="33" y="26" width="44" height="10" rx="1" fill="#F7EBD8"/></g><path d="M20 84 h60" stroke="#fff" stroke-width="3" stroke-linecap="round"/>'},
  {id:"wordplay", name:"Word Play", aka:"formerly Word Drop", genre:"Puzzle", bg:"#7A3E6E", url:"", icon:"",
   blurb:"Letters fall onto the board. Arrange them into the level's goal words before the stack tops out.", tags:["Words","Falling blocks"],
   art:'<g font-family="Bricolage Grotesque,Arial Black,sans-serif" font-weight="800" font-size="18" text-anchor="middle"><rect x="14" y="62" width="22" height="22" rx="3" fill="#D4A64A"/><text x="25" y="80" fill="#14181F">W</text><rect x="39" y="62" width="22" height="22" rx="3" fill="#D4A64A"/><text x="50" y="80" fill="#14181F">O</text><rect x="64" y="62" width="22" height="22" rx="3" fill="#D4A64A"/><text x="75" y="80" fill="#14181F">R</text><rect x="46" y="18" width="22" height="22" rx="3" fill="#E9E4DA"/><text x="57" y="36" fill="#7A3E6E">D</text></g>'},
  {id:"notedrop", name:"Note Drop", genre:"Music", bg:"#245C8A", url:"", icon:"",
   blurb:"Colored notes fall toward an unlabeled keyboard. Tap the right key and learn piano as you play.", tags:["Rhythm","Learn piano"],
   art:'<rect x="12" y="62" width="76" height="28" fill="#fff"/><g stroke="#245C8A" stroke-width="2"><path d="M27 62 v28 M42 62 v28 M57 62 v28 M72 62 v28"/></g><rect x="23" y="62" width="8" height="16" fill="#14181F"/><rect x="38" y="62" width="8" height="16" fill="#14181F"/><rect x="68" y="62" width="8" height="16" fill="#14181F"/><circle cx="34" cy="22" r="7" fill="#E05757"/><circle cx="64" cy="38" r="7" fill="#F2B66B"/><circle cx="50" cy="12" r="6" fill="#8FD3C9"/>'}
];

const grid=document.getElementById('grid'), filters=document.getElementById('filters'), count=document.getElementById('count');
const genres=['All',...[...new Set(GAMES.map(g=>g.genre))].sort()];
let current='All';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const list=GAMES.filter(g=>current==='All'||g.genre===current);
  grid.innerHTML=list.map(g=>{
    const n=GAMES.indexOf(g)+1;
    const icon=g.icon?`<img src="${esc(g.icon)}" alt="${esc(g.name)} app icon">`:`<svg viewBox="0 0 100 100" role="img" aria-label="${esc(g.name)} icon">${g.art}</svg>`;
    const btn=g.url?`<a class="btn live" href="${esc(g.url)}" target="_blank" rel="noopener">Get it on Google Play</a>`:`<span class="btn soon">Coming soon to Google Play</span>`;
    return `<article class="card" id="${g.id}">
      <div class="top">
        <div class="icon" style="background:${g.bg}">${icon}</div>
        <div class="titles">
          <div class="unit">Apt B-${String(n).padStart(2,'0')} · ${esc(g.genre)}</div>
          <h3>${esc(g.name)}</h3>
          ${g.aka?`<div class="aka">${esc(g.aka)}</div>`:''}
        </div>
      </div>
      <p>${esc(g.blurb)}</p>
      <div class="tags">${g.tags.map(t=>`<span class="t">${esc(t)}</span>`).join('')}</div>
      ${btn}
    </article>`;
  }).join('');
  count.textContent=current==='All'?`All ${list.length} games`:`${current} · ${list.length}`;
  filters.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.g===current));
}
filters.innerHTML=genres.map(g=>`<button class="chip" id="f-${g}" data-g="${g}" aria-pressed="false">${g}</button>`).join('');
filters.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;current=b.dataset.g;try{localStorage.setItem('pb-filter',current)}catch(_){}render();});
try{const s=localStorage.getItem('pb-filter');if(s&&genres.includes(s))current=s}catch(_){}
render();
</script>

</body></html>
