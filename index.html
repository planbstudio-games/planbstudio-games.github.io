<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note Drop</title>
<meta name="description" content="Note Drop - a simple game that helps you learn piano notes.">
<style>
  :root {
    --bg: #171d36;
    --card: #0a0f1f;
    --text: #f4f7ff;
    --muted: #a9b3d5;
    --accent: #39ddf5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  main {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid #1b2444;
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 2rem; color: var(--accent); }
  p { color: var(--muted); margin: 8px 0 20px; }
  .button {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 14px;
    border: 2px solid var(--accent);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
  }
  .button:hover { background: #292f55; }
  footer { margin-top: 24px; font-size: 0.9rem; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>
<body>

<main>
  <h1>Note Drop</h1>
  <p>Notes fall from the top. Tap the matching piano key to score. A fun way to learn the keys.</p>
  <a class="button" href="[GOOGLE PLAY LINK]">Get it on Google Play</a>
</main>

<footer>
  <a href="privacy.html">Privacy Policy</a> &middot;
  <a href="mailto:cboxgo@gmail.com">Contact</a><br>
  &copy; 2026 Plan B Studio
</footer>

</body>
</html>
